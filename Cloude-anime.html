```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video to Anime (No-GPU)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0a0a0c; color: #e4e4e7; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(23, 23, 26, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .anime-border { border: 2px solid #f43f5e; box-shadow: 0 0 15px rgba(244, 63, 94, 0.3); }
        .loader {
            width: 24px; height: 24px; border: 3px solid #333; border-top-color: #f43f5e;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .frame-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    </style>
</head>
<body class="min-h-screen p-4">

    <div class="max-w-6xl mx-auto">
        <header class="flex items-center justify-between mb-8 py-4 border-b border-white/5">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-rose-600 rounded-lg"><i class="fa-solid fa-wand-magic-sparkles text-white"></i></div>
                <h1 class="text-xl font-bold tracking-tight">CloudAnime <span class="text-rose-500 text-xs font-normal border border-rose-500/30 px-2 py-0.5 rounded ml-2">NO-GPU MODE</span></h1>
            </div>
            <div class="text-xs text-zinc-500 bg-zinc-900 px-3 py-1 rounded-full">Uses Cloud AI Inference</div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- Left: Controls -->
            <div class="lg:col-span-1 space-y-4">
                <div class="glass p-5 rounded-2xl">
                    <h3 class="text-sm font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-video text-rose-500"></i> Video Input</h3>
                    <label class="block w-full cursor-pointer">
                        <div class="border-2 border-dashed border-zinc-700 rounded-xl p-6 text-center hover:border-rose-500/50 transition-colors">
                            <i class="fa-solid fa-cloud-arrow-up text-2xl text-zinc-600 mb-2"></i>
                            <p class="text-xs text-zinc-500">Select MP4/MOV</p>
                        </div>
                        <input type="file" id="videoInput" class="hidden" accept="video/*">
                    </label>
                    <div id="videoMeta" class="hidden mt-4 p-3 bg-black/40 rounded-lg text-[10px] space-y-1">
                        <p id="fileName" class="text-zinc-300 font-bold truncate"></p>
                        <p id="duration" class="text-zinc-500"></p>
                    </div>
                </div>

                <div class="glass p-5 rounded-2xl">
                    <h3 class="text-sm font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-palette text-rose-500"></i> Anime Style</h3>
                    <select id="styleSelect" class="w-full bg-zinc-800 border-none rounded-lg p-2 text-sm text-zinc-300 focus:ring-2 focus:ring-rose-500 outline-none">
                        <option value="studio ghibli style, lush scenery, hand-drawn">Studio Ghibli</option>
                        <option value="makoto shinkai style, high contrast, detailed sky">Makoto Shinkai</option>
                        <option value="90s retro anime, grainy cel-shaded">90s Retro OVA</option>
                        <option value="cyberpunk anime style, neon lighting, clean lines">Cyberpunk Edge</option>
                    </select>

                    <div class="mt-4">
                        <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-2 block">Frame Sampling</label>
                        <input type="range" id="samplingRange" min="3" max="10" value="5" class="w-full accent-rose-500">
                        <div class="flex justify-between text-[10px] text-zinc-500 mt-1">
                            <span>Fast (3 frames)</span>
                            <span>Quality (10 frames)</span>
                        </div>
                    </div>

                    <button id="processBtn" disabled class="w-full mt-6 bg-rose-600 hover:bg-rose-500 disabled:bg-zinc-800 disabled:text-zinc-600 py-3 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-bolt"></i> Convert Video
                    </button>
                </div>
            </div>

            <!-- Right: Viewer -->
            <div class="lg:col-span-3 space-y-6">
                <div class="glass rounded-3xl p-2 min-h-[400px] flex flex-col relative overflow-hidden">
                    <div id="processingOverlay" class="hidden absolute inset-0 z-50 bg-black/80 flex flex-col items-center justify-center p-12 text-center">
                        <div class="loader mb-4"></div>
                        <h4 class="text-lg font-bold text-white mb-2" id="loaderTitle">Extracting Frames</h4>
                        <p class="text-zinc-500 text-sm max-w-xs" id="loaderDesc">Slicing video into high-resolution segments for Cloud AI processing.</p>
                        <div class="w-full max-w-xs bg-zinc-800 h-1.5 rounded-full mt-6 overflow-hidden">
                            <div id="progressBar" class="bg-rose-500 h-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>

                    <div id="playerContainer" class="flex-grow flex items-center justify-center bg-black/20 rounded-2xl border border-white/5 relative">
                        <video id="mainVideo" class="max-h-[500px] w-full hidden" controls></video>
                        <div id="emptyState" class="text-center">
                            <i class="fa-solid fa-film text-4xl text-zinc-800 mb-4"></i>
                            <p class="text-zinc-600 text-sm italic">Video preview will appear here</p>
                        </div>
                    </div>
                </div>

                <div class="space-y-3">
                    <h3 class="text-xs font-black text-zinc-500 uppercase tracking-widest px-2">Anime Sequence Result</h3>
                    <div id="resultsGrid" class="frame-grid">
                        <!-- Resulting anime frames go here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden canvas for frame extraction -->
    <canvas id="extractCanvas" class="hidden"></canvas>

    <script>
        const apiKey = ""; // Runtime provided
        const videoInput = document.getElementById('videoInput');
        const mainVideo = document.getElementById('mainVideo');
        const emptyState = document.getElementById('emptyState');
        const processBtn = document.getElementById('processBtn');
        const resultsGrid = document.getElementById('resultsGrid');
        const extractCanvas = document.getElementById('extractCanvas');
        const processingOverlay = document.getElementById('processing-overlay'); // Fixed reference in logic below
        
        // UI Helpers
        const overlay = document.getElementById('processingOverlay');
        const progressBar = document.getElementById('progressBar');
        const loaderTitle = document.getElementById('loaderTitle');
        const loaderDesc = document.getElementById('loaderDesc');

        let videoBlob = null;

        videoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            videoBlob = URL.createObjectURL(file);
            mainVideo.src = videoBlob;
            mainVideo.classList.remove('hidden');
            emptyState.classList.add('hidden');
            processBtn.disabled = false;

            document.getElementById('videoMeta').classList.remove('hidden');
            document.getElementById('fileName').textContent = file.name;
            mainVideo.onloadedmetadata = () => {
                document.getElementById('duration').textContent = `Duration: ${mainVideo.duration.toFixed(1)}s`;
            };
        });

        async function extractFrame(time) {
            return new Promise((resolve) => {
                mainVideo.currentTime = time;
                mainVideo.onseeked = () => {
                    const ctx = extractCanvas.getContext('2d');
                    extractCanvas.width = mainVideo.videoWidth;
                    extractCanvas.height = mainVideo.videoHeight;
                    ctx.drawImage(mainVideo, 0, 0);
                    resolve(extractCanvas.toDataURL('image/jpeg', 0.8));
                };
            });
        }

        async function processToAnime(base64Image, style) {
            const base64Data = base64Image.split(',')[1];
            const prompt = `Convert this video frame into a professional ${style}. 
            Maintain the exact composition and characters but redraw them in high-quality 2D anime art style.`;

            const payload = {
                contents: [{
                    parts: [
                        { text: prompt },
                        { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                    ]
                }],
                generationConfig: { responseModalities: ['TEXT', 'IMAGE'] }
            };

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            return data.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
        }

        processBtn.addEventListener('click', async () => {
            const count = parseInt(document.getElementById('samplingRange').value);
            const style = document.getElementById('styleSelect').value;
            
            overlay.classList.remove('hidden');
            resultsGrid.innerHTML = '';
            processBtn.disabled = true;

            const duration = mainVideo.duration;
            const step = duration / count;
            
            for (let i = 0; i < count; i++) {
                const progress = ((i / count) * 100).toFixed(0);
                progressBar.style.width = `${progress}%`;
                loaderTitle.textContent = `Processing Frame ${i+1} of ${count}`;
                loaderDesc.textContent = "Extracting frame and sending to Cloud AI for redrawing...";

                const timestamp = i * step;
                const frameBase64 = await extractFrame(timestamp);
                
                try {
                    const animeData = await processToAnime(frameBase64, style);
                    if (animeData) {
                        const container = document.createElement('div');
                        container.className = "group relative rounded-xl overflow-hidden border border-white/5 bg-zinc-900";
                        container.innerHTML = `
                            <img src="data:image/jpeg;base64,${animeData}" class="w-full aspect-video object-cover animate-fade-in" />
                            <div class="absolute bottom-0 inset-x-0 bg-black/60 p-2 text-[8px] font-bold text-rose-400 opacity-0 group-hover:opacity-100 transition-opacity">
                                RENDERED @ ${timestamp.toFixed(1)}s
                            </div>
                        `;
                        resultsGrid.appendChild(container);
                    }
                } catch (e) {
                    console.error("Frame failed", e);
                }
            }

            overlay.classList.add('hidden');
            processBtn.disabled = false;
        });
    </script>
    
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-fade-in { animation: fadeIn 0.5s ease forwards; }
    </style>
</body>
</html>
